<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resin Dice Roller</title>
<meta name="description" content="3D dice roller with real physics: d4, d6, d8, d10, d12 and d20 on a felt table. Hold dice, add a modifier, roll in the browser.">
<meta property="og:title" content="Resin Dice Roller">
<meta property="og:description" content="Roll d4 to d20 in 3D with real physics, right in the browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tidymaze.github.io/3d-dice/">
<meta property="og:image" content="https://tidymaze.github.io/3d-dice/screenshots/roll-all.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0c10">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
<style>
  :root { --glass: rgba(24, 26, 32, .62); --line: rgba(255, 255, 255, .14); --fg: #f2f0ea; --dim: #a9a79f; --accent: #e8b44c;
    --gap: 16px; --l: calc(var(--gap) + env(safe-area-inset-left, 0px)); --r: calc(var(--gap) + env(safe-area-inset-right, 0px));
    --t: calc(var(--gap) + env(safe-area-inset-top, 0px)); --b: calc(var(--gap) + env(safe-area-inset-bottom, 0px)); color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0c10; color: var(--fg);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .panel { position: fixed; background: var(--glass); border: 1px solid var(--line); border-radius: 16px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  #controls { left: var(--l); top: var(--t); width: 280px; max-height: calc(100% - 32px); overflow: auto; }
  #results { right: var(--r); top: var(--t); width: 260px; max-height: calc(100% - 32px); overflow: auto; }
  h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; }
  .row b { font-weight: 600; letter-spacing: .04em; }
  .count { display: flex; align-items: center; gap: 10px; }
  .count span { min-width: 1.5em; text-align: center; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: var(--fg); background: rgba(255,255,255,.08); border: 1px solid var(--line);
    border-radius: 10px; cursor: pointer; touch-action: manipulation; }
  button:hover { background: rgba(255,255,255,.16); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .count button { width: 32px; height: 32px; font-size: 18px; line-height: 1; padding: 0; }
  #range { margin: 2px 0 0; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  #swatches { display: flex; gap: 8px; margin: 4px 0 14px; flex-wrap: wrap; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; padding: 0; border: 2px solid transparent; }
  .swatch[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px rgba(0,0,0,.5) inset; }
  .actions { display: grid; gap: 8px; }
  #roll { padding: 14px; font-size: 18px; font-weight: 700; letter-spacing: .12em; background: var(--accent); color: #1a1405; border: 0; }
  #roll:hover { background: #f3c566; }
  #clear { padding: 8px; color: var(--dim); }
  .head { display: flex; justify-content: space-between; align-items: baseline; }
  #mute { padding: 2px 8px; font-size: 12px; color: var(--dim); }
  #total { font-size: 40px; font-weight: 700; line-height: 1.1; margin: 0 0 8px; font-variant-numeric: tabular-nums; }
  #total small { font-size: 12px; color: var(--dim); font-weight: 500; letter-spacing: .1em; margin-left: 6px; }
  .group { margin: 6px 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .group i { font-style: normal; color: var(--dim); font-size: 12px; width: 2.4em; }
  .chip { min-width: 30px; padding: 3px 8px; text-align: center; border-radius: 8px; background: rgba(255,255,255,.1);
    font-variant-numeric: tabular-nums; font-weight: 600; }
  .chip.pulse { animation: pulse .7s ease-out; }
  .chip.held { box-shadow: 0 0 0 1px var(--accent) inset; color: var(--accent); }
  @keyframes pulse { 0% { transform: scale(1.5); background: var(--accent); color: #1a1405; } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .chip.pulse { animation: none; } }
  #history { margin: 12px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line); list-style: none; color: var(--dim); font-size: 13px; }
  #history li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  #history b { color: var(--fg); }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); text-align: center; color: var(--dim); font-size: 12px; pointer-events: none; }

  /* hide-UI: panels go away, a small total and the toggle stay */
  #ui-toggle { position: fixed; right: var(--r); bottom: var(--b); z-index: 2; width: 44px; height: 44px; padding: 0;
    border-radius: 50%; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-size: 18px; }
  #mini { position: fixed; left: 50%; top: var(--t); transform: translateX(-50%); padding: 6px 16px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; pointer-events: none; }
  body:not(.ui-hidden) #mini, body.ui-hidden .panel, body.ui-hidden #hint { display: none; }

  @media (max-width: 640px) {
    :root { --gap: 8px; }
    #controls { right: var(--r); top: auto; bottom: var(--b); width: auto; max-height: 55%; padding: 10px 12px; }
    #results { left: var(--l); right: calc(var(--r) + 52px); width: auto; max-height: 26%; padding: 8px 12px; }
    #ui-toggle { top: var(--t); bottom: auto; }
    #controls h2 { display: none; }
    #counters { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; }
    .row { margin: 2px 0; }
    .count { gap: 6px; }
    .count button { width: 36px; height: 34px; }
    #range { margin: 2px 0 6px; }
    #swatches { margin: 0 0 8px; justify-content: space-between; }
    .swatch { width: 32px; height: 32px; }
    .actions { grid-template-columns: 3fr 1fr; }
    #roll { padding: 12px; }
    .head h2 { margin: 0; }
    #total { font-size: 26px; margin: 2px 0 4px; }
    .group { margin: 2px 0; }
    #history, #hint { display: none; }
  }
</style>
</head>
<body>
<div id="stage"></div>

<section class="panel" id="controls" aria-label="Dice setup">
  <h2>Dice</h2>
  <div id="counters"></div>
  <p id="range"></p>
  <h2 style="margin-top:14px">Color</h2>
  <div id="swatches"></div>
  <div class="actions">
    <button id="roll">ROLL</button>
    <button id="clear">Clear</button>
  </div>
</section>

<section class="panel" id="results" aria-live="polite" aria-label="Results">
  <div class="head"><h2>Result</h2><button id="mute" aria-pressed="false">Sound on</button></div>
  <p id="total">–</p>
  <div id="groups"></div>
  <ul id="history"></ul>
</section>

<div id="mini" aria-hidden="true">–</div>
<button id="ui-toggle" aria-pressed="false" aria-label="Hide controls" title="Hide controls (H)">◱</button>

<div id="hint">Space or tap the table to roll · tap a die to hold it · H hides the panels · drag to orbit</div>

<script type="module" src="main.js"></script>
</body>
</html>
