<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dice</title>
<link rel="icon" href="data:,">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
<style>
  :root { --glass: rgba(24, 26, 32, .62); --line: rgba(255, 255, 255, .14); --fg: #f2f0ea; --dim: #a9a79f; --accent: #e8b44c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0c10; color: var(--fg);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .panel { position: fixed; background: var(--glass); border: 1px solid var(--line); border-radius: 16px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  #controls { left: 16px; top: 16px; width: 280px; max-height: calc(100% - 32px); overflow: auto; }
  #results { right: 16px; top: 16px; width: 260px; max-height: calc(100% - 32px); overflow: auto; }
  h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; }
  .row b { font-weight: 600; letter-spacing: .04em; }
  .count { display: flex; align-items: center; gap: 10px; }
  .count span { min-width: 1.5em; text-align: center; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: var(--fg); background: rgba(255,255,255,.08); border: 1px solid var(--line);
    border-radius: 10px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.16); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .count button { width: 32px; height: 32px; font-size: 18px; line-height: 1; padding: 0; }
  #swatches { display: flex; gap: 8px; margin: 4px 0 14px; flex-wrap: wrap; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; padding: 0; border: 2px solid transparent; }
  .swatch[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px rgba(0,0,0,.5) inset; }
  #roll { width: 100%; padding: 14px; font-size: 18px; font-weight: 700; letter-spacing: .12em; margin-top: 8px;
    background: var(--accent); color: #1a1405; border: 0; }
  #roll:hover { background: #f3c566; }
  #clear { width: 100%; padding: 8px; margin-top: 8px; color: var(--dim); }
  #total { font-size: 40px; font-weight: 700; line-height: 1.1; margin: 0 0 8px; font-variant-numeric: tabular-nums; }
  #total small { font-size: 12px; color: var(--dim); font-weight: 500; letter-spacing: .1em; margin-left: 6px; }
  .group { margin: 6px 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .group i { font-style: normal; color: var(--dim); font-size: 12px; width: 2.4em; }
  .chip { min-width: 30px; padding: 3px 8px; text-align: center; border-radius: 8px; background: rgba(255,255,255,.1);
    font-variant-numeric: tabular-nums; font-weight: 600; }
  .chip.pulse { animation: pulse .7s ease-out; }
  @keyframes pulse { 0% { transform: scale(1.5); background: var(--accent); color: #1a1405; } 100% { transform: scale(1); } }
  #history { margin: 12px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line); list-style: none; color: var(--dim); font-size: 13px; }
  #history li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  #history b { color: var(--fg); }
  #hint { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center; color: var(--dim); font-size: 12px; pointer-events: none; }
  @media (max-width: 640px) {
    #controls { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 60%; }
    #results { left: 8px; right: 8px; top: 8px; width: auto; max-height: 30%; padding: 10px; }
    #controls { padding: 10px 14px; }
    .row { margin: 3px 0; }
    #swatches { margin-bottom: 6px; }
    #roll { padding: 10px; }
    #total { font-size: 28px; }
    #history { display: none; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<div id="stage"></div>

<section class="panel" id="controls" aria-label="Dice setup">
  <h2>Dice</h2>
  <div id="counters"></div>
  <h2 style="margin-top:14px">Color</h2>
  <div id="swatches"></div>
  <button id="roll">ROLL</button>
  <button id="clear">Clear</button>
</section>

<section class="panel" id="results" aria-live="polite" aria-label="Results">
  <h2>Result</h2>
  <p id="total">–</p>
  <div id="groups"></div>
  <ul id="history"></ul>
</section>

<div id="hint">Space or tap the table to roll · drag to orbit</div>

<script type="module" src="main.js"></script>
</body>
</html>
